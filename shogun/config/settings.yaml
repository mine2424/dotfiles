# multi-agent-shogun 設定
# dotfiles/shogun/config/settings.yaml
# setup.sh --shogun で ~/.local/share/shogun/config/ にマージされる

language: ja

cli:
  default: claude-code
  kessen_model: opus

max_agents: 7

session_manager: zellij

