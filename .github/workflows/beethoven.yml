name: Beethoven
on:
  push:
    paths: ['beethoven/**', '.github/workflows/beethoven.yml']
  pull_request:
    paths: ['beethoven/**', '.github/workflows/beethoven.yml']
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: beethoven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: beethoven/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
  tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: beethoven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: beethoven/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
  terminal:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: beethoven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: beethoven/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/install-local.mjs --bin-dir "$RUNNER_TEMP/beethoven-bin"
      - run: python3 scripts/check-tui-pty.py
        env:
          BEETHOVEN_LAUNCHER: ${{ runner.temp }}/beethoven-bin/beethoven
      - run: python3 scripts/check-dialogue-pty.py
