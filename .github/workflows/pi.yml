name: Pi setup
on:
  push:
    paths:
      - 'pi/**'
      - 'scripts/*pi*'
      - 'scripts/smoke-pstack.mjs'
      - 'scripts/setup.sh'
      - 'scripts/utils/**'
      - 'scripts/tests/test_setup_pi.py'
      - '.github/workflows/pi.yml'
  pull_request:
    paths:
      - 'pi/**'
      - 'scripts/*pi*'
      - 'scripts/smoke-pstack.mjs'
      - 'scripts/setup.sh'
      - 'scripts/utils/**'
      - 'scripts/tests/test_setup_pi.py'
      - '.github/workflows/pi.yml'
permissions:
  contents: read
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n scripts/setup.sh scripts/setup-pi.sh
      - run: node --check scripts/configure-pi.mjs
      - run: node --check scripts/smoke-pstack.mjs
      - run: python3 -m unittest discover -s scripts/tests -p test_setup_pi.py -v
