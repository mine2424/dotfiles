# Portable baseline. Keep account, app, project trust and MCP credentials local.
# Model/effort reflect the locally selected defaults observed on 2026-10-16.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
web_search = "live"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
network_access = true

# macOS desktop notification for Codex task completion.
notify = ["sh", "-c", 'exec bash "$HOME/.codex/notify_macos.sh" "$@"', "codex-notify"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.serena]
command = "uvx"
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "codex",
    "--open-web-dashboard",
    "False",
]
